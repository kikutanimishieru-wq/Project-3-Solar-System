<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body">

<div class="solar-system">
        <!-- Central Sun -->
      <div class="sun center-position center-image"
      style="--image-url: url('./sun.png'); "
      ></div>

      <div class="orbit center-position" style="--orbit: 150px; --orbit-period: 8.8s">
            <div class="planet center-position center-image" 
            style="--planet: 15px; --image-url: url(./mercury.png); --rotation-period: 5.86s"></div>
      </div>
      
        
      <div class="orbit center-position" style="--orbit: 200px; --orbit-period: 22.5s">
            <div class="planet center-position center-image" 
            style="--planet: 20px; --image-url: url(./venus.png); --rotation-period: 24.3s"></div>
      </div>

            
      <div class="orbit center-position" style="--orbit: 300px; --orbit-period: 36.5s">
            <div class="planet center-position center-image" 
            style="--planet: 23px; --image-url: url(./earth.png); --rotation-period: 1s"></div>
      </div>

    
      <div class="orbit center-position" style="--orbit: 400px; --orbit-period: 68.7s">
            <div class="planet center-position center-image" 
            style="--planet: 17px; --image-url: url(./mars.png); --rotation-period: 1.025s"></div>
      </div>

        <div class="orbit center-position" style="--orbit: 550px; --orbit-period: 118.6s">
            <div class="planet center-position center-image" 
            style="--planet: 45px; --image-url: url(./jupiter.png); --rotation-period: 0.41s"></div>
        </div>

        <div class="orbit center-position" style="--orbit: 650px; --orbit-period: 294.6s">
            <div class="planet center-position center-image" 
            style="--planet: 40px; --image-url: url(./saturn.png); --rotation-period: 0.445s"></div>
        </div>

         <div class="orbit center-position" style="--orbit: 750px; --orbit-period: 840.0s">
            <div class="planet center-position center-image" 
            style="--planet: 35px; --image-url: url(./uranus.png); --rotation-period: 0.717s"></div>
        </div>

          <div class="orbit center-position" style="--orbit: 850px; --orbit-period: 1648.0s">
            <div class="planet center-position center-image" 
            style="--planet: 33px; --image-url: url(./neptune.png); --rotation-period: 0.671s"></div>
        </div>

    </div>

</body>
